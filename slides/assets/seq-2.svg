<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="Helvetica Neue, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6ebd"/>
    </marker>
    <marker id="s2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5f7a"/>
    </marker>
    <style>
      .lane { fill: #12314f; }
      .lanetxt { font-size: 15px; fill: #ffffff; font-weight: 700; letter-spacing: .04em; }
      .life { stroke: #b6c4d6; stroke-width: 1.5; }
      .req  { stroke: #0b6ebd; stroke-width: 2.2; marker-end: url(#s2); }
      .res  { stroke: #4a5f7a; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#s2d); }
      .msg  { font-size: 14.5px; fill: #12233b; }
      .mono { font-family: SFMono-Regular, Menlo, monospace; font-size: 13.5px; fill: #0b6ebd; font-weight: 600; }
      .num  { font-size: 13px; fill: #ffffff; font-weight: 700; }
      .self { fill: #ffffff; stroke: #0b6ebd; stroke-width: 2; }
      .selftxt { font-size: 14.5px; fill: #12233b; font-weight: 600; }
    </style>
  </defs>

  <!-- lane headers -->
  <rect class="lane" x="40"  y="0" width="220" height="34" rx="6"/>
  <text x="150" y="23" class="lanetxt" text-anchor="middle">main.py</text>
  <rect class="lane" x="310" y="0" width="240" height="34" rx="6"/>
  <text x="430" y="23" class="lanetxt" text-anchor="middle">LOOPBACK LISTENER</text>
  <rect class="lane" x="610" y="0" width="240" height="34" rx="6"/>
  <text x="730" y="23" class="lanetxt" text-anchor="middle">ZOOM /token</text>
  <rect class="lane" x="890" y="0" width="240" height="34" rx="6"/>
  <text x="1010" y="23" class="lanetxt" text-anchor="middle">ZOOM API</text>

  <!-- lifelines -->
  <line class="life" x1="150"  y1="34" x2="150"  y2="452"/>
  <line class="life" x1="430"  y1="34" x2="430"  y2="452"/>
  <line class="life" x1="730"  y1="34" x2="730"  y2="452"/>
  <line class="life" x1="1010" y1="34" x2="1010" y2="452"/>

  <!-- 9. hand the params back -->
  <line class="res" x1="430" y1="62" x2="156" y2="62"/>
  <text x="293" y="56" class="msg" text-anchor="middle">captured <tspan class="mono">code</tspan> + <tspan class="mono">state</tspan></text>
  <circle cx="46" cy="62" r="11" fill="#4a5f7a"/><text x="46" y="67" class="num" text-anchor="middle">9</text>

  <!-- 10. state guard -->
  <rect class="self" x="54" y="84" width="300" height="40" rx="7" stroke="#b4530a"/>
  <text x="204" y="109" class="selftxt" text-anchor="middle">state matches? else abort — CSRF guard</text>
  <circle cx="46" cy="104" r="11" fill="#b4530a"/><text x="46" y="109" class="num" text-anchor="middle">10</text>

  <!-- 11. close listener -->
  <line class="req" x1="150" y1="152" x2="424" y2="152"/>
  <text x="287" y="146" class="msg" text-anchor="middle">close immediately</text>
  <circle cx="46" cy="152" r="11" fill="#0b6ebd"/><text x="46" y="157" class="num" text-anchor="middle">11</text>

  <!-- 12. POST /token -->
  <line class="req" x1="150" y1="216" x2="724" y2="216"/>
  <text x="437" y="182" class="mono" text-anchor="middle">POST /oauth/token  (application/x-www-form-urlencoded)</text>
  <text x="437" y="198" class="msg" text-anchor="middle">grant_type, code, client_id, redirect_uri, <tspan class="mono">code_verifier</tspan></text>
  <text x="437" y="212" class="msg" text-anchor="middle" style="fill:#c0392b;font-weight:700">no client_secret · no Authorization header</text>
  <circle cx="46" cy="216" r="11" fill="#0b6ebd"/><text x="46" y="221" class="num" text-anchor="middle">12</text>

  <!-- 13. THE PKCE CHECK -->
  <rect x="596" y="242" width="290" height="58" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="741" y="263" class="selftxt" text-anchor="middle" style="fill:#c0392b">THE PKCE CHECK</text>
  <text x="741" y="285" class="mono" style="fill:#c0392b" text-anchor="middle">SHA256(verifier) == challenge ?</text>
  <circle cx="46" cy="271" r="11" fill="#c0392b"/><text x="46" y="276" class="num" text-anchor="middle">13</text>
  <text x="741" y="316" class="msg" text-anchor="middle">Zoom re-derives it from the challenge stored at step 4</text>

  <!-- 14. tokens -->
  <line class="res" x1="730" y1="336" x2="156" y2="336"/>
  <text x="443" y="330" class="msg" text-anchor="middle">
    <tspan class="mono">access_token</tspan>, <tspan class="mono">refresh_token</tspan>, expires_in 3599
  </text>
  <circle cx="46" cy="336" r="11" fill="#4a5f7a"/><text x="46" y="341" class="num" text-anchor="middle">14</text>

  <!-- 15. call the API -->
  <line class="req" x1="150" y1="380" x2="1004" y2="380"/>
  <text x="577" y="374" class="mono" text-anchor="middle">GET /v2/users/me      Authorization: Bearer …</text>
  <circle cx="46" cy="380" r="11" fill="#0b6ebd"/><text x="46" y="385" class="num" text-anchor="middle">15</text>

  <!-- 16. profile -->
  <line class="res" x1="1010" y1="414" x2="156" y2="414"/>
  <text x="583" y="408" class="msg" text-anchor="middle">display_name, email, account_id — the token works</text>
  <circle cx="46" cy="414" r="11" fill="#4a5f7a"/><text x="46" y="419" class="num" text-anchor="middle">16</text>

  <!-- footer note -->
  <rect x="40" y="430" width="1090" height="34" rx="6" fill="#d3e6f6"/>
  <text x="585" y="452" class="msg" text-anchor="middle" font-weight="600">
    An attacker who stole the code at step 8 never had the code_verifier — step 13 rejects them.
  </text>
</svg>
