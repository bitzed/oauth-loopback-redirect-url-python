<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" font-family="Helvetica Neue, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6ebd"/>
    </marker>
    <style>
      .lbl  { font-size: 20px; fill: #12233b; font-weight: 600; }
      .sub  { font-size: 14.5px; fill: #4a5f7a; }
      .mono { font-size: 15.5px; fill: #0b6ebd; font-family: SFMono-Regular, Menlo, monospace; font-weight: 600; }
      .hd   { font-size: 16px; font-weight: 700; letter-spacing: .08em; }
      .edge { stroke: #0b6ebd; stroke-width: 2.2; fill: none; marker-end: url(#a2); }
      .box  { fill: #ffffff; stroke: #c9d4e3; stroke-width: 1.5; }
      .n    { font-size: 14px; fill: #ffffff; font-weight: 700; }
      .leg  { font-size: 15.5px; fill: #12233b; }
      .legn { font-size: 14px; fill: #ffffff; font-weight: 700; }
    </style>
  </defs>

  <!-- machine boundary -->
  <rect x="20" y="10" width="690" height="350" rx="12" fill="#e2e8f1" stroke="#4a5f7a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="38" y="36" class="hd" fill="#4a5f7a">YOUR MACHINE</text>

  <!-- app process -->
  <rect class="box" x="56" y="54" width="280" height="96" rx="9"/>
  <text x="196" y="84" class="lbl" text-anchor="middle">main.py</text>
  <text x="196" y="107" class="sub" text-anchor="middle">code_verifier · code_challenge · state</text>
  <text x="196" y="132" class="mono" text-anchor="middle">stdlib only</text>

  <!-- loopback listener -->
  <rect class="box" x="56" y="232" width="280" height="112" rx="9" stroke="#0b6ebd" stroke-width="2.5"/>
  <text x="196" y="261" class="lbl" text-anchor="middle">Throwaway HTTP server</text>
  <text x="196" y="288" class="mono" text-anchor="middle">127.0.0.1:54929</text>
  <text x="196" y="311" class="sub" text-anchor="middle">loopback only — never 0.0.0.0</text>
  <text x="196" y="331" class="sub" text-anchor="middle">closed the instant the code lands</text>

  <!-- browser -->
  <rect class="box" x="396" y="140" width="280" height="104" rx="9"/>
  <text x="536" y="172" class="lbl" text-anchor="middle">System browser</text>
  <text x="536" y="197" class="sub" text-anchor="middle">the user's real browser —</text>
  <text x="536" y="217" class="sub" text-anchor="middle">already signed in to Zoom</text>

  <!-- zoom cloud -->
  <rect x="780" y="70" width="360" height="220" rx="12" fill="#12314f"/>
  <text x="960" y="106" class="hd" fill="#ffffff" text-anchor="middle">ZOOM</text>
  <rect x="806" y="124" width="308" height="48" rx="7" fill="#1d4a72"/>
  <text x="960" y="154" class="mono" style="fill:#9fd0f5" text-anchor="middle">zoom.us/oauth/authorize</text>
  <rect x="806" y="186" width="308" height="48" rx="7" fill="#1d4a72"/>
  <text x="960" y="216" class="mono" style="fill:#9fd0f5" text-anchor="middle">zoom.us/oauth/token</text>
  <text x="960" y="264" class="sub" style="fill:#9fb8d2" text-anchor="middle">reachable from anywhere</text>

  <!-- 5. app starts the listener -->
  <path class="edge" d="M196,150 L196,226"/>
  <circle cx="196" cy="190" r="13" fill="#0b6ebd"/><text x="196" y="195" class="n" text-anchor="middle">5</text>

  <!-- 1. app opens the browser -->
  <path class="edge" d="M336,104 L390,152"/>
  <circle cx="363" cy="128" r="13" fill="#0b6ebd"/><text x="363" y="133" class="n" text-anchor="middle">1</text>

  <!-- 2. browser to authorize -->
  <path class="edge" d="M676,166 L774,142"/>
  <circle cx="725" cy="154" r="13" fill="#0b6ebd"/><text x="725" y="159" class="n" text-anchor="middle">2</text>

  <!-- 3. zoom redirects the browser back -->
  <path class="edge" d="M774,226 L676,214"/>
  <circle cx="725" cy="220" r="13" fill="#0b6ebd"/><text x="725" y="225" class="n" text-anchor="middle">3</text>

  <!-- 4. browser hits the listener -->
  <path class="edge" d="M396,232 L342,272"/>
  <circle cx="369" cy="252" r="13" fill="#0b6ebd"/><text x="369" y="257" class="n" text-anchor="middle">4</text>

  <!-- 6. app posts straight to the token endpoint, crossing the boundary -->
  <path class="edge" d="M336,66 C520,20 660,26 800,104"/>
  <circle cx="566" cy="34" r="13" fill="#c0392b"/><text x="566" y="39" class="n" text-anchor="middle">6</text>

  <!-- legend -->
  <line x1="20" y1="376" x2="1140" y2="376" stroke="#c9d4e3" stroke-width="1.5"/>
  <circle cx="32" cy="396" r="11" fill="#0b6ebd"/><text x="32" y="401" class="legn" text-anchor="middle">1</text>
  <text x="50" y="401" class="leg">main.py opens the authorize URL in the browser</text>
  <circle cx="32" cy="424" r="11" fill="#0b6ebd"/><text x="32" y="429" class="legn" text-anchor="middle">2</text>
  <text x="50" y="429" class="leg">Browser loads Zoom's consent screen</text>

  <circle cx="560" cy="396" r="11" fill="#0b6ebd"/><text x="560" y="401" class="legn" text-anchor="middle">3</text>
  <text x="578" y="401" class="leg">Zoom sends a 302 back to 127.0.0.1:54929</text>
  <circle cx="560" cy="424" r="11" fill="#0b6ebd"/><text x="560" y="429" class="legn" text-anchor="middle">4</text>
  <text x="578" y="429" class="leg">The listener captures ?code &amp; state</text>

  <circle cx="960" cy="396" r="11" fill="#0b6ebd"/><text x="960" y="401" class="legn" text-anchor="middle">5</text>
  <text x="978" y="401" class="leg">bound first</text>
  <circle cx="960" cy="424" r="11" fill="#c0392b"/><text x="960" y="429" class="legn" text-anchor="middle">6</text>
  <text x="978" y="429" class="leg">no browser</text>
</svg>
